name: CI

on:
  push:
    branches: [develop, staging, feature/project-scaffold]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Verify project structure
        run: |
          echo "✅ Repo structure verified"
          ls -la