name: Nightly database backup

# Takes an encrypted copy of the database every night and keeps it as a private workflow artifact for 30 days.
# Add these repository secrets first (Settings > Secrets and variables > Actions):
#   BACKUP_DATABASE_URL  a READ-ONLY database user's connection string
#   BACKUP_PASSPHRASE    the passphrase that encrypts the file (also keep it in your password manager)
#   BACKUP_DEST          optional: an S3-compatible location such as s3://bucket/uniarena (needs AWS_* secrets too)
on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client gnupg
      - name: Back up the database
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          BACKUP_DEST: ${{ secrets.BACKUP_DEST }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          BACKUP_DIR: backups
        run: bash backend/scripts/backup.sh
      - uses: actions/upload-artifact@v4
        with:
          name: uniarena-db-backup
          path: backups/*.gpg
          retention-days: 30
          if-no-files-found: error
